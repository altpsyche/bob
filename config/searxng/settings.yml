use_default_settings: true
server:
  # secret_key is supplied by SEARXNG_SECRET (generated by Bob on first start, kept via osenv.ensure_secret).
  # bind_address is inside the container; the host side is published on bindHost only (docker-compose.yml).
  bind_address: "0.0.0.0:8080"
search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json
