# The two opt-in Docker services (Docker-free by default; started on demand, never at setup).
# n8n runs native (pure Node) and is NOT here; web search uses the built-in ddgs provider, not SearXNG.
#
# Ports are read from tools/compose/.env, written by scripts/tools/stack.py on start.
#
# Start:   bob services searxng start   |   bob services langfuse start
# Stop:    bob services searxng stop    |   bob services langfuse stop
# Status:  bob services <name> status
# Logs:    bob services <name> logs
# The first start runs a guided Docker install if Docker isn't present.

services:
  langfuse-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - ${REPO_PATH}/tools/langfuse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    ports:
      - "${LANGFUSE_PORT}:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_SECRET: bob-langfuse-secret
      SALT: bob-salt-1234
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_ORG_NAME: bob
      LANGFUSE_INIT_USER_EMAIL: admin@local.dev
      LANGFUSE_INIT_USER_PASSWORD: admin123
      LANGFUSE_INIT_PROJECT_ID: main
      LANGFUSE_INIT_PROJECT_NAME: bob

  searxng:
    image: searxng/searxng:2026.6.26-f8ffbf36f
    restart: unless-stopped
    ports:
      - "${SEARXNG_PORT}:8080"
    volumes:
      - ${REPO_PATH}/config/searxng:/etc/searxng:rw
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: none
