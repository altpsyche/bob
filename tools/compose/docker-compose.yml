# The two opt-in Docker services (Docker-free by default; started on demand, never at setup).
# n8n runs native (pure Node) and is NOT here; web search uses the built-in ddgs provider, not SearXNG.
#
# Ports and the bind address are read from tools/compose/.env, written by scripts/tools/stack.py on start.
# Every published port binds to ${BIND_HOST} (the bindHost config key, default 127.0.0.1: loopback only).
# Secrets (${SEARXNG_SECRET}, ${LANGFUSE_*}) are generated on first start via osenv.ensure_secret and passed
# in the environment of `docker compose up`; nothing secret is written here or in .env.
#
# Start:   bob services searxng start   |   bob services langfuse start
# Stop:    bob services searxng stop    |   bob services langfuse stop
# Status:  bob services <name> status
# Logs:    bob services <name> logs
# The first start runs a guided Docker install if Docker isn't present.
#
# Langfuse is v3 (web + worker over Postgres, ClickHouse, Redis and S3-compatible MinIO). v3 is what serves
# both paths Bob uses: LiteLLM's `langfuse` callback (the langfuse 2.x SDK ingestion API) and the OTLP
# endpoint /api/public/otel/v1/traces that agent.tracingSink "otlp" exports to. Only the web UI is published;
# the backing stores are reachable on the compose network alone.

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/langfuse
  NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

x-langfuse-depends: &langfuse-depends
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy

services:
  langfuse-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - ${REPO_PATH}/tools/langfuse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.8
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    # create the 'langfuse' bucket before starting the server
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 10

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: *langfuse-depends
    environment:
      <<: *langfuse-env

  langfuse:
    image: langfuse/langfuse:3
    restart: unless-stopped
    ports:
      - "${BIND_HOST}:${LANGFUSE_PORT}:3000"
    depends_on:
      <<: *langfuse-depends
      langfuse-worker:   # `up -d langfuse` must bring the ingestion worker too
        condition: service_started
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: local
      LANGFUSE_INIT_ORG_NAME: bob
      LANGFUSE_INIT_PROJECT_ID: main
      LANGFUSE_INIT_PROJECT_NAME: bob
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}

  searxng:
    image: searxng/searxng:2026.6.26-f8ffbf36f
    restart: unless-stopped
    ports:
      - "${BIND_HOST}:${SEARXNG_PORT}:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ${REPO_PATH}/config/searxng:/etc/searxng:rw
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: none

volumes:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
