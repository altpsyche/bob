# The one CI workflow. Jobs:
#   lint           — shellcheck (bootstrap .sh/shim). Every PR (GATES).
#   core-suite     — Python core + check.py gate on Linux + Windows, no GPU. Every PR.
#   prereqs-distro — install_prereqs.sh + diagnose across fedora/arch/opensuse containers. NON-GATING
#                    first (proves the dnf/pacman/zypper package-map cells resolve on real distros).
#   eval           — agent-capability eval (records-based, no live model), both OSes. NON-GATING.
#   acceptance-cpu — fresh-install + e2e smoke on the CPU tier, both OSes. Every PR (GATES).
#   manifest-contract-live — fetch the published engines.json and assert the resolver selects every row.
#                    Schedule + manual (the drift guard behind the hermetic contract test). NON-GATING.
#
# GPU acceptance (real inference on a GPU) is run LOCALLY at release time, not in CI — a self-hosted runner on
# a public repo is an unacceptable standing risk. See docs/GPU-ACCEPTANCE.md.
#
# The per-PR gate is the portable/CPU tier only. Native-from-source CUDA is exercised solely in the
# non-gating release-tag tier, so a fragile native build can never red a per-PR gate. core-suite is the
# executable proof the Python core is OS-agnostic; acceptance-cpu is the proof a clean machine ->
# documented steps -> working Bob on both OSes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']        # release tags additionally trigger the GPU acceptance tier
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC — the live engine-manifest drift guard (manifest-contract-live)
  workflow_dispatch:
    inputs:
      eval_gate:
        description: 'Fail the eval job if the capability score is below this fraction (0..1); blank = report only'
        required: false
        default: ''

# Cancel a superseded run only on PRs (a new push kills the stale one). NEVER on main/tags/schedule, so a
# release publish in flight is never interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Smart-CI change detection: which tiers a given change actually needs. Uses the GitHub API (via gh) rather
  # than a git diff or a marketplace action, so it is self-contained and robust to shallow clones / base-ref
  # quirks. FAIL-SAFE: any ambiguity (first push, missing base, API error, schedule/dispatch) => run everything.
  #   code    = anything outside docs/markdown/images changed  -> run the heavy acceptance-cpu + eval tiers
  #   prereqs = the install/package surface changed             -> run the prereqs-distro container matrix
  changes:
    name: changes (what to run)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      prereqs: ${{ steps.classify.outputs.prereqs }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        # NOTE: NOT `set -e`. This job must never exit non-zero: a failed `changes` job would make every
        # dependent (acceptance-cpu/eval/prereqs-distro) skip, silently disabling the gate. On any error we
        # fall back to "__ALL__" (run everything) and still exit 0.
        run: |
          set -uo pipefail
          ev="${{ github.event_name }}"
          files="__ALL__"
          if [ "$ev" = "pull_request" ]; then
            files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                      --paginate -q '.[].filename' 2>/dev/null) || files="__ALL__"
          elif [ "$ev" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
              files=$(gh api "repos/${{ github.repository }}/compare/${before}...${{ github.sha }}" \
                        -q '.files[].filename' 2>/dev/null) || files="__ALL__"
            fi
          fi
          [ -z "$files" ] && files="__ALL__"   # empty result (API hiccup / weird diff) -> fail-safe
          echo "changed files:"; printf '  %s\n' $files
          code=false; prereqs=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ "$f" = "__ALL__" ]; then code=true; prereqs=true; break; fi
            case "$f" in
              docs/*|*.md|*.png|*.jpg|*.jpeg|*.gif|*.svg) : ;;   # docs-only -> irrelevant to the heavy tiers
              *) code=true ;;
            esac
            case "$f" in
              install_prereqs*|scripts/osenv.py|setup*|install/*|.github/workflows/ci.yml) prereqs=true ;;
            esac
          done <<< "$files"
          echo "code=$code"       >> "$GITHUB_OUTPUT"
          echo "prereqs=$prereqs" >> "$GITHUB_OUTPUT"
          echo "-> code=$code prereqs=$prereqs"

  # Static analysis of the shell bootstrap. shellcheck catches bashisms/quoting/unset-var bugs in the
  # .sh entry points + the `bob` shim.
  lint:
    name: lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the bootstrap shims
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck install_prereqs.sh setup.sh bob install/install.sh

  core-suite:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Core-suite deps only (no GPU, no inference stack). The agent runtime imports openai/mcp
      # lazily; tests inject fakes, so the heavy providers aren't needed to run the suite.
      # sqlite-utils + requests are real deps of bob_memory (test_memory imports it), which
      # sys.exit(1)s at import if they're missing — omitting them fails the whole suite, not one test.
      - name: Install core-suite deps
        shell: bash
        # rich/prompt_toolkit/pyfiglet (shell UI) + PyYAML (skills manifests) + python-multipart
        # (FastAPI multipart routes, e.g. the faster-whisper STT server) are lightweight pure-python
        # runtime deps — installed so those tests run for real (the tests also skip cleanly if these
        # are ever absent, so the suite still passes minimally).
        run: python -m pip install --upgrade pip fastapi uvicorn pydantic httpx requests openai sqlite-utils rich prompt_toolkit pyfiglet pyyaml python-multipart

      # One gate, both OSes: py_compile + lock sync + exec-bits + the unittest core suite. Runs on
      # the CI interpreter (there is no venv-litellm here); check.py is stdlib-only.
      - name: check.py (py_compile + verbs/lock sync + unittest core suite)
        run: python scripts/check.py

  # Agent-capability eval on the Win+Linux matrix, EVERY PR but NON-GATING (continue-on-error): it
  # reports a deterministic capability score from a records-based run (scripted client + FakeRegistry,
  # NO live model — CPU-safe, mirrors the smoke's CPU-tier tolerance). A maintainer can enforce a
  # threshold on demand via the workflow_dispatch `eval_gate` input (run_eval.py --gate); PR runs stay
  # report-only until baselines stabilize.
  eval:
    name: eval (${{ matrix.os }})
    # Same skip as acceptance-cpu: off on tags and docs-only changes (the eval imports the agent runtime).
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true           # non-gating on PRs — reports the score, never reds a PR
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same lightweight core deps as core-suite — the eval imports the agent runtime (bob_core/bob_loop)
      # and injects fakes, so no GPU / inference stack is needed.
      - name: Install core deps
        shell: bash
        run: python -m pip install --upgrade pip fastapi uvicorn pydantic httpx requests openai sqlite-utils

      - name: Agent-capability eval (records-based)
        shell: bash
        run: |
          gate="${{ github.event.inputs.eval_gate }}"
          if [ -n "$gate" ]; then
            python tests/eval/run_eval.py --json --gate "$gate"
          else
            python tests/eval/run_eval.py --json
          fi

  # Fresh-install acceptance on the CPU tier, both OSes, EVERY PR (gates). Provisions a clean runner per
  # the documented one-command entry, builds the CPU llama.cpp, serves the tiny CPU GGUF, and runs the
  # shared cross-OS smoke (provision -> serve -> coherent answer -> agent server /health + owner-scoped
  # session + SSE). No GPU. This is the FIRST place the Linux provisioner path executes end-to-end for
  # real; expect first-run debugging here, not in production.
  acceptance-cpu:
    name: acceptance-cpu (${{ matrix.os }})
    # Skip on tags (the commit already passed on main) and on docs-only changes (nothing that affects the
    # build/runtime changed). lint + core-suite still run on tags as the cheap sanity.
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: scripts   # so `python -m bob` / `python -m bob.kernel` resolve from the checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # the CPU build needs external/llama.cpp checked out (not just the gitlink)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Building llama.cpp (even CPU) is minutes-scale. Two SEPARATE caches keyed on their actual inputs, so a
      # release/version-only lock change (only the `release` field moves) reuses BOTH fully warm:
      #   build cache  <- submodule commits + toolchain floor (what the compile depends on)
      #   model cache  <- the model manifest (what `bob fetch` downloads)
      - name: Compute cache keys (from versions.lock)
        id: keys
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json
          d = json.load(open("versions.lock"))
          def h(x): return hashlib.sha256(json.dumps(x, sort_keys=True).encode()).hexdigest()[:16]
          print("build=" + h([d.get("submodules"), d.get("toolchain")]))
          print("model=" + h(d.get("models")))
          PY
      # Build cache: EXACT key only (no restore-keys). A partial restore could bring back a prior submodule
      # commit's bin/llama-server; if `bob build` skips on binary-present, CI would test a stale engine. A real
      # submodule bump therefore does a clean rebuild; release/model-only changes hit the exact key (warm).
      - name: Cache the engine build
        uses: actions/cache@v4
        with:
          path: |
            bin
            external/llama.cpp/build
          key: ${{ runner.os }}-bob-build-${{ steps.keys.outputs.build }}
      # Model cache: restore-keys is safe here because `bob fetch` reconciles + sha-verifies against the lock,
      # so a partial restore is always corrected.
      - name: Cache the fetched models
        uses: actions/cache@v4
        with:
          path: models
          key: ${{ runner.os }}-bob-model-${{ steps.keys.outputs.model }}
          restore-keys: ${{ runner.os }}-bob-model-

      # Documented one-command prerequisites, CPU variant. Per-OS entry script.
      - name: Install prerequisites (Linux, CPU)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x install_prereqs.sh setup.sh
          ./install_prereqs.sh --cpu
      - name: Install prerequisites (Windows, CPU)
        if: runner.os == 'Windows'
        shell: bash
        run: python -m bob.kernel prereqs --cpu

      # Bob's Python runtime venv (the agent server the smoke exercises is python -m bob).
      # The cold-start kernel provisions it via osenv.new_bob_venv.
      - name: Bootstrap the Python runtime venv
        shell: bash
        run: python -m bob.kernel venv litellm

      # CPU tier: select the profile, build CPU-only llama.cpp + the llama-swap proxy (Go, from the
      # submodule), fetch the tiny GGUF (verified against versions.lock). llama-swap is what `bob up`
      # launches as the endpoint, so it must be built before the stack comes up. All via the Python
      # front door / kernel.
      - name: Select CPU profile + build + fetch (from versions.lock)
        shell: bash
        run: |
          python -m bob profile cpu
          python -m bob build --cpu
          python -m bob.kernel build-swap
          python -m bob fetch cpu

      # Prove the one-command installer's post-setup gate: the installed submodules + fetched model
      # match versions.lock, and the lock is in sync with its sources. (The install/install.sh clone-vs-
      # pull logic is gated by shellcheck + tests/test_install_bootstrap.py; here we exercise the
      # verify-install step it runs against the real provisioned tree.)
      - name: Verify against versions.lock (installer gate)
        shell: bash
        run: python -m bob.kernel verify-install

      - name: Bring the stack up
        shell: bash
        run: python -m bob up -NoOpen

      # The shared cross-OS end-to-end gate. --up also starts the agent server and tears it down after.
      # A red smoke blocks the PR. smoke.py is stdlib-only, runs on any interpreter.
      - name: End-to-end smoke
        run: python scripts/smoke.py --up

      # Prove fresh-install voice works by default: the faster-whisper STT server serves the /inference
      # contract on CPU. Fetches the tiny CT2 model (~75 MB, cached with models/) and does a synthetic-WAV
      # round-trip under venv-litellm. Gating — a broken default voice backend blocks the PR.
      - name: Voice STT smoke (faster-whisper CPU)
        shell: bash
        run: python scripts/smoke_voice.py

      # Surface why the endpoint died (the smoke only says "check: bob logs" — CI has no `bob logs`).
      - name: Dump service logs on failure
        if: failure()
        shell: bash
        run: |
          for log in logs/llama-swap.log logs/litellm.log logs/whisper.log; do
            echo "===== $log ====="
            if [ -f "$log" ]; then tail -n 120 "$log"; else echo "(missing)"; fi
          done
          echo "===== bin/ ====="
          ls -l bin 2>/dev/null || true

  # Fresh-install prereq matrix across the non-apt distro families, so the
  # dnf/pacman/zypper columns of osenv.PACKAGE_MAP (and install_prereqs.sh -> the kernel's per-distro
  # install) actually EXECUTE in CI instead of rotting untested (core-suite/acceptance-cpu only exercise
  # apt). Runs the documented one-command Linux entry inside each distro image, then `bob diagnose` (which
  # exits non-zero on any real problem — the honest health gate). Checkout stays on the host (the distro
  # images lack the Node the checkout action needs); the workspace is bind-mounted into the container.
  #
  # NON-GATING for now (continue-on-error) — like `eval` started: distro package-name drift (esp. the
  # opensuse nodejs-default/npm-default guesses) surfaces here in the log without blocking merges. Flip
  # to gating (remove continue-on-error) once the names are proven green across all three images.
  prereqs-distro:
    name: prereqs (${{ matrix.image }})
    # Only when the install/package surface changed, plus the weekly schedule (catches distro package-map
    # drift). Skipped on tags and on unrelated PRs. Already non-gating (continue-on-error), so zero risk.
    needs: [changes]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (needs.changes.outputs.prereqs == 'true' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:latest', 'archlinux:latest', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - name: install_prereqs.sh + diagnose (in ${{ matrix.image }})
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/bob -w /bob "${{ matrix.image }}" bash -c '
            set -e
            chmod +x install_prereqs.sh
            ./install_prereqs.sh --cpu
            PYTHONPATH=scripts python3 -m bob diagnose
          '

  # GPU acceptance (real inference on an NVIDIA GPU) is run LOCALLY at release time, not in CI: this is a
  # public repo and a self-hosted GPU runner is an unacceptable standing attack surface (a fork PR runs the
  # workflow from its own commit and could execute on the box). The maintainer runs the documented procedure
  # in docs/GPU-ACCEPTANCE.md — `scripts/smoke.py --require-gpu --expect-source ...` after a prebuilt build on
  # a tag checkout — and records the result. The resolver itself is still guarded in CI by the hermetic
  # TestManifestContract (every PR) and manifest-contract-live (scheduled, real published manifest).

  # Build + publish the prebuilt, DRIVER-ONLY engine binaries for a tagged release (the outlier fix: users
  # download these instead of compiling). Both tiers build in an OLD-glibc container (Ubuntu 20.04, glibc
  # 2.31) so the binary runs on essentially every current distro (manylinux principle: build old, run
  # newer); a host with a still-older glibc is caught by lifecycle._binary_runs and safely falls back to a
  # source build. The CUDA archive bundles the CUDA runtime libs and the binary's rpath is set to $ORIGIN
  # (patchelf), so a target box needs only the NVIDIA driver. Each binary uploads to the GitHub release with
  # a build-provenance attestation; the publish-manifest job assembles their rows into an engines.json release
  # asset that lifecycle.ensure_engine fetches + SHA-verifies + stages. Windows engines are built the same way
  # by publish-engines-windows (below), so every asset matches the exact pinned llama.cpp commit.
  #
  # arm64 Linux and AMD/Intel (Vulkan/ROCm) GPUs have no asset today, so they fall back to a source build
  # (AMD/Intel land the CPU tier until a Vulkan backend is added). NVIDIA Turing..Blackwell are all covered by
  # the one fat multi-arch CUDA binary.
  publish-engines-linux:
    name: publish-engines (linux ${{ matrix.tier }}, release tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # upload release assets
      id-token: write            # build provenance attestation (sigstore)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        tier: [cuda, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: llama.cpp commit (cache key)
        id: llama
        run: echo "sha=$(git rev-parse HEAD:external/llama.cpp)" >> "$GITHUB_OUTPUT"

      # Restore the compile cache warmed on main by warm-engine-cache.yml — a tag run can read default-branch
      # caches, so the multi-arch CUDA build hits a warm ccache instead of recompiling from scratch. Restore
      # only (main is the producer): a tag-scoped save would be evicted on the next re-cut and just waste the
      # cache budget. Falls back through restore-keys to the newest prior cache for this tier.
      - name: Restore ccache (warmed on main)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.tier }}-${{ steps.llama.outputs.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.tier }}-

      - name: Build + package the ${{ matrix.tier }} engine in an old-glibc container (portable, no GPU needed)
        shell: bash
        run: |
          set -e
          mkdir -p .ccache
          img="ubuntu:20.04"
          [ "${{ matrix.tier }}" = "cuda" ] && img="nvidia/cuda:12.8.0-devel-ubuntu20.04"
          docker run --rm -e TIER="${{ matrix.tier }}" \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=5G \
            -v "$PWD":/bob -v "$PWD/.ccache":/ccache -w /bob "$img" bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y && apt-get install -y git ninja-build g++ python3 patchelf tar curl xz-utils
            git config --global --add safe.directory "*"   # the mounted repo is owned by the host uid
            source /bob/.github/scripts/ccache-in-container.sh
            name="llama-server-linux-x86_64-$TIER"
            staging="dist/$name"; mkdir -p "$staging"
            if [ "$TIER" = "cuda" ]; then
              PYTHONPATH=scripts python3 -m bob build --dist --cuda-archs "75;80;89;120"
            else
              PYTHONPATH=scripts python3 -m bob build --dist --cpu
            fi
            # Bundle the binary AND llama.cpp shared libs (libllama, libggml*, libllama-server-impl, libmtmd,
            # ...). The build puts these next to the binary; without them the engine will not start. -P keeps
            # the SONAME symlink chain. The publish container builds only llama.cpp, so bin/ holds exactly its
            # libs (no voice/vision libs to exclude).
            cp -P bin/llama-server "$staging"/
            cp -P bin/*.so* "$staging"/
            # OpenMP runtime: llama.cpp links libgomp.so.1, present in the build image but absent on minimal
            # systems, so bundle it for portability (both tiers).
            gomp=$(find -L /usr/lib /lib -name "libgomp.so.1*" 2>/dev/null | head -1 || true)
            [ -n "$gomp" ] && cp -L "$gomp" "$staging/libgomp.so.1" || { echo "FAIL: libgomp not found"; exit 1; }
            if [ "$TIER" = "cuda" ]; then     # + the CUDA runtime libs so the package is driver-only
              for lib in libcudart libcublas libcublasLt libnccl; do
                # -L follows the /usr/local/cuda symlink (find would not descend it otherwise); also search
                # /usr/lib since some CUDA libs (e.g. NCCL) install outside the toolkit dir. The binary links
                # the SONAME (libX.so.MAJOR), but find may return the versioned libX.so.MAJOR.MINOR.PATCH, so
                # bundle the real file AND create the SONAME symlink. (ldd here cannot catch a wrong name: the
                # container system CUDA masks it, so assert the SONAME file explicitly; the clean-container
                # gate below is the authoritative check.)
                f=$(find -L /usr/local/cuda /usr/lib /lib -name "${lib}.so.*" 2>/dev/null | head -1 || true)
                [ -n "$f" ] || { echo "FAIL: $lib not found in the CUDA toolkit"; exit 1; }
                base=$(basename "$f"); cp -L "$f" "$staging/$base"
                soname=$(printf "%s" "$base" | sed -E "s/(\.so\.[0-9]+)\..*/\1/")
                [ "$soname" != "$base" ] && [ ! -e "$staging/$soname" ] && ln -s "$base" "$staging/$soname"
                [ -e "$staging/$soname" ] || { echo "FAIL: $lib SONAME $soname missing from package"; exit 1; }
              done
            fi
            # rpath $ORIGIN on the binary and every real lib so each resolves its siblings from its own dir.
            for f in "$staging"/llama-server "$staging"/*.so*; do
              if [ -f "$f" ] && [ ! -L "$f" ]; then patchelf --set-rpath "\$ORIGIN" "$f" 2>/dev/null || true; fi
            done
            ls -la "$staging"
            # Self-verify the package: every needed lib resolves via $ORIGIN EXCEPT libcuda.so.1, the NVIDIA
            # driver, which is absent in this driver-less build container and is provided by the user driver at
            # runtime. Any other unresolved lib fails the job, so a broken archive can never be uploaded.
            missing=$(ldd "$staging/llama-server" 2>/dev/null | grep -i "not found" | grep -v "libcuda.so.1" || true)
            if [ -n "$missing" ]; then echo "FAIL: unresolved shared libraries:"; echo "$missing"; exit 1; fi
            echo "package link check ok (libcuda.so.1 comes from the NVIDIA driver at runtime)"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            ccache -sv || true                # per-run cache stats (hit rate) for visibility
            chmod -R a+rX /ccache || true     # so actions/cache (runner user) can read the root-created files
          '

      - name: Verify the package is self-contained in a CLEAN container (no CUDA to mask a gap), before upload
        shell: bash
        run: |
          set -e
          name="llama-server-linux-x86_64-${{ matrix.tier }}"
          # Extract + ldd in a bare ubuntu:20.04 with NO CUDA and NO toolchain: the only way to resolve a lib
          # is from the bundle itself (via the binary's $ORIGIN rpath). A missing bundled lib or SONAME shows
          # as "not found" here (the build container's system CUDA would have hidden it). libcuda.so.1 is the
          # NVIDIA driver, expected-absent and supplied at runtime, so it is excluded. This gate runs BEFORE
          # the upload, so a broken package fails the job instead of shipping.
          docker run --rm -e NAME="$name" -v "$PWD/dist":/d ubuntu:20.04 bash -c '
            set -e
            tar -C /tmp -xzf "/d/$NAME.tar.gz"
            miss=$(ldd "/tmp/$NAME/llama-server" 2>/dev/null | grep -i "not found" | grep -v "libcuda.so.1" || true)
            if [ -n "$miss" ]; then echo "FAIL: unresolved in a clean environment:"; echo "$miss"; exit 1; fi
            echo "clean-container link check ok for $NAME"
          '

      - name: Checksum + emit the engines.json row
        id: pkg
        shell: bash
        run: |
          set -e
          tier="${{ matrix.tier }}"; name="llama-server-linux-x86_64-$tier"
          sha=$(sha256sum "dist/$name.tar.gz" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$name.tar.gz"
          commit=$(git rev-parse "HEAD:external/llama.cpp")
          archs="75;80;89;120"; cmaj="12"
          [ "$tier" = "cpu" ] && archs="" && cmaj="null"
          mkdir -p rows
          cat > "rows/$name.json" <<JSON
          {"$name": {"component": "llama-server", "os": "linux", "cpuArch": "x86_64", "tier": "$tier",
            "url": "$url", "sha256": "$sha", "builtFromCommit": "$commit", "cudaArchs": "$archs", "cudaMajor": $cmaj}}
          JSON
          echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.asset }}" --clobber

      - name: Attest build provenance (tamper-evident, verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - name: Stash the engines.json row for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: engine-row-linux-${{ matrix.tier }}
          path: rows/*.json

  # Windows engines, built by Bob for consistency (so the asset matches the exact pinned llama.cpp commit,
  # avoiding a brittle official-asset-to-commit mapping). Bundled CUDA DLLs sit next to the .exe (Windows
  # resolves those from the exe's own dir), so the target needs only the NVIDIA driver. First-run CI: expect
  # to shake out the CUDA-toolkit install + VS build here, like the GPU acceptance tier.
  publish-engines-windows:
    name: publish-engines (windows ${{ matrix.tier }}, release tags)
    if: startsWith(github.ref, 'refs/tags/v')
    # windows-2022 = VS 2022 (MSVC 14.4x), which CUDA 12.8's nvcc supports. windows-latest moved to VS 2026
    # (MSVC 14.51), where nvcc's cudafe++ crashes — so the CUDA engine must build on the pinned 2022 image.
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write            # build provenance attestation (sigstore)
      attestations: write
    env:
      PYTHONPATH: scripts
    strategy:
      fail-fast: false
      matrix:
        tier: [cuda, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # cl.exe + Ninja come from osenv.ensure_msvc_env() at build time (no msvc-dev-cmd needed — this also
      # exercises the auto-activation users rely on). Only ccache is external.
      - name: Set up ccache
        shell: bash
        run: |
          choco install ccache -y
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
      - name: llama.cpp commit (cache key)
        id: llama
        shell: bash
        run: echo "sha=$(git rev-parse HEAD:external/llama.cpp)" >> "$GITHUB_OUTPUT"
      # Restore the ccache warmed on main by warm-engine-cache.yml (tag runs read default-branch caches).
      # Restore only — main is the producer, so a tag-scoped save would just waste the budget.
      - name: Restore ccache (warmed on main)
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.tier }}-${{ steps.llama.outputs.sha }}
          restore-keys: |
            ccache-windows-${{ matrix.tier }}-
      - name: Install CUDA toolkit (cuda tier only)
        if: matrix.tier == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35   # 12.8.0 is available from this release onward
        with:
          cuda: '12.8.0'
          method: network
      - name: Build + package the ${{ matrix.tier }} engine
        shell: bash
        run: |
          set -e
          ccache -z || true
          name="llama-server-windows-x86_64-${{ matrix.tier }}"
          staging="dist/$name"; mkdir -p "$staging"
          if [ "${{ matrix.tier }}" = "cuda" ]; then
            python -m bob build --dist --cuda-archs "75;80;89;120"
          else
            python -m bob build --dist --cpu
          fi
          ccache -sv || true
          # build_llama already staged the CUDA runtime DLLs next to llama-server.exe in bin/ on Windows.
          cp bin/llama-server.exe "$staging"/
          cp bin/*.dll "$staging"/ 2>/dev/null || true
          powershell -Command "Compress-Archive -Path '$staging/*' -DestinationPath 'dist/$name.zip' -Force"
      - name: Checksum + emit the engines.json row
        id: pkg
        shell: bash
        run: |
          set -e
          tier="${{ matrix.tier }}"; name="llama-server-windows-x86_64-$tier"
          sha=$(sha256sum "dist/$name.zip" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$name.zip"
          commit=$(git rev-parse "HEAD:external/llama.cpp")
          archs="75;80;89;120"; cmaj="12"
          [ "$tier" = "cpu" ] && archs="" && cmaj="null"
          mkdir -p rows
          cat > "rows/$name.json" <<JSON
          {"$name": {"component": "llama-server", "os": "windows", "cpuArch": "x86_64", "tier": "$tier",
            "url": "$url", "sha256": "$sha", "builtFromCommit": "$commit", "cudaArchs": "$archs", "cudaMajor": $cmaj}}
          JSON
          echo "asset=dist/$name.zip" >> "$GITHUB_OUTPUT"
      - name: Upload the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.asset }}" --clobber
      - name: Attest build provenance (tamper-evident, verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}
      - name: Stash the engines.json row for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: engine-row-windows-${{ matrix.tier }}
          path: rows/*.json

  # Assemble the engine manifest from the published rows and upload it AS A RELEASE ASSET (engines.json).
  # No commit, no PR, no repo write-back: lifecycle.ensure_engine fetches this manifest for the release tag
  # a checkout is on, then downloads + SHA-verifies the matching binary. Adding platforms/components/channels
  # never churns the repo, so this scales as the build matrix grows. Only `contents: write` (asset upload) is
  # needed; there is no pull-request permission and nothing to merge to activate a release.
  publish-manifest:
    name: publish-manifest (engines.json release asset)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-engines-linux, publish-engines-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-row-*
          path: rows
          merge-multiple: true
      - name: Assemble engines.json from the published rows
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json
          rows = {}
          for f in glob.glob("rows/*.json"):
              rows.update(json.load(open(f)))
          open("engines.json", "w").write(json.dumps(rows, indent=2) + "\n")
          print("engines.json rows:", list(rows))
          PY
      - name: Upload engines.json to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" engines.json --clobber --repo "${GITHUB_REPOSITORY}"

  # Fetch the ACTUAL published engines.json for the latest release and assert the resolver still selects every
  # row (the drift guard from the 'tier: cuda vs gpu' incident, backstopping the hermetic TestManifestContract).
  # Runs off the tag path (schedule + manual) so an already-shipped release cannot silently rot; at tag time the
  # freshly-published prebuilt is verified more thoroughly by the local GPU acceptance runbook (docs/GPU-ACCEPTANCE.md),
  # which downloads and RUNS the asset. It only READS a public asset over the network — skips cleanly offline /
  # no tag, so it never falses.
  manifest-contract-live:
    name: manifest-contract-live (published engines.json)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: scripts
      BOB_LIVE_MANIFEST_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags for _latest_release_tag + `git rev-parse <tag>:<submodule>`
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve + verify the published manifest (stdlib only)
        run: python -m unittest tests.test_release_manifest.TestPublishedManifestLive -v
        env:
          PYTHONPATH: scripts:tests
