# The one CI workflow. Jobs:
#   lint           — shellcheck (bootstrap .sh/shim). Every PR (GATES).
#   core-suite     — Python core + check.py gate on Linux + Windows, no GPU. Every PR.
#   prereqs-distro — install_prereqs.sh + diagnose across fedora/arch/opensuse containers. NON-GATING
#                    first (proves the dnf/pacman/zypper package-map cells resolve on real distros).
#   eval           — agent-capability eval (records-based, no live model), both OSes. NON-GATING.
#   acceptance-cpu — fresh-install + e2e smoke on the CPU tier, both OSes. Every PR (GATES).
#   acceptance-gpu — native-from-source CUDA + real inference on a self-hosted GPU. RELEASE TAGS ONLY.
#
# The per-PR gate is the portable/CPU tier only. Native-from-source CUDA is exercised solely in the
# non-gating release-tag tier, so a fragile native build can never red a per-PR gate. core-suite is the
# executable proof the Python core is OS-agnostic; acceptance-cpu is the proof a clean machine ->
# documented steps -> working Bob on both OSes.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']        # release tags additionally trigger the GPU acceptance tier
  workflow_dispatch:
    inputs:
      eval_gate:
        description: 'Fail the eval job if the capability score is below this fraction (0..1); blank = report only'
        required: false
        default: ''

jobs:
  # Static analysis of the shell bootstrap. shellcheck catches bashisms/quoting/unset-var bugs in the
  # .sh entry points + the `bob` shim.
  lint:
    name: lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck the bootstrap shims
        run: |
          sudo apt-get update -y && sudo apt-get install -y shellcheck
          shellcheck install_prereqs.sh setup.sh bob install/install.sh

  core-suite:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Core-suite deps only (no GPU, no inference stack). The agent runtime imports openai/mcp
      # lazily; tests inject fakes, so the heavy providers aren't needed to run the suite.
      # sqlite-utils + requests are real deps of bob_memory (test_memory imports it), which
      # sys.exit(1)s at import if they're missing — omitting them fails the whole suite, not one test.
      - name: Install core-suite deps
        shell: bash
        # rich/prompt_toolkit/pyfiglet (shell UI) + PyYAML (skills manifests) + python-multipart
        # (FastAPI multipart routes, e.g. the faster-whisper STT server) are lightweight pure-python
        # runtime deps — installed so those tests run for real (the tests also skip cleanly if these
        # are ever absent, so the suite still passes minimally).
        run: python -m pip install --upgrade pip fastapi uvicorn pydantic httpx requests openai sqlite-utils rich prompt_toolkit pyfiglet pyyaml python-multipart

      # One gate, both OSes: py_compile + lock sync + exec-bits + the unittest core suite. Runs on
      # the CI interpreter (there is no venv-litellm here); check.py is stdlib-only.
      - name: check.py (py_compile + verbs/lock sync + unittest core suite)
        run: python scripts/check.py

  # Agent-capability eval on the Win+Linux matrix, EVERY PR but NON-GATING (continue-on-error): it
  # reports a deterministic capability score from a records-based run (scripted client + FakeRegistry,
  # NO live model — CPU-safe, mirrors the smoke's CPU-tier tolerance). A maintainer can enforce a
  # threshold on demand via the workflow_dispatch `eval_gate` input (run_eval.py --gate); PR runs stay
  # report-only until baselines stabilize.
  eval:
    name: eval (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true           # non-gating on PRs — reports the score, never reds a PR
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same lightweight core deps as core-suite — the eval imports the agent runtime (bob_core/bob_loop)
      # and injects fakes, so no GPU / inference stack is needed.
      - name: Install core deps
        shell: bash
        run: python -m pip install --upgrade pip fastapi uvicorn pydantic httpx requests openai sqlite-utils

      - name: Agent-capability eval (records-based)
        shell: bash
        run: |
          gate="${{ github.event.inputs.eval_gate }}"
          if [ -n "$gate" ]; then
            python tests/eval/run_eval.py --json --gate "$gate"
          else
            python tests/eval/run_eval.py --json
          fi

  # Fresh-install acceptance on the CPU tier, both OSes, EVERY PR (gates). Provisions a clean runner per
  # the documented one-command entry, builds the CPU llama.cpp, serves the tiny CPU GGUF, and runs the
  # shared cross-OS smoke (provision -> serve -> coherent answer -> agent server /health + owner-scoped
  # session + SSE). No GPU. This is the FIRST place the Linux provisioner path executes end-to-end for
  # real; expect first-run debugging here, not in production.
  acceptance-cpu:
    name: acceptance-cpu (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: scripts   # so `python -m bob` / `python -m bob.kernel` resolve from the checkout
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive     # the CPU build needs external/llama.cpp checked out (not just the gitlink)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Realism note — building llama.cpp (even CPU) is minutes-scale. Cache the built binaries,
      # the downloaded model, and the llama.cpp build tree, keyed by the versions.lock hash so a PR that
      # doesn't move the pins reuses the cache instead of rebuilding/redownloading from scratch.
      - name: Cache build + model by versions.lock
        uses: actions/cache@v4
        with:
          path: |
            bin
            models
            external/llama.cpp/build
          key: ${{ runner.os }}-bob-cpu-${{ hashFiles('versions.lock') }}

      # Documented one-command prerequisites, CPU variant. Per-OS entry script.
      - name: Install prerequisites (Linux, CPU)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x install_prereqs.sh setup.sh
          ./install_prereqs.sh --cpu
      - name: Install prerequisites (Windows, CPU)
        if: runner.os == 'Windows'
        shell: bash
        run: python -m bob.kernel prereqs --cpu

      # Bob's Python runtime venv (the agent server the smoke exercises is python -m bob).
      # The cold-start kernel provisions it via osenv.new_bob_venv.
      - name: Bootstrap the Python runtime venv
        shell: bash
        run: python -m bob.kernel venv litellm

      # CPU tier: select the profile, build CPU-only llama.cpp + the llama-swap proxy (Go, from the
      # submodule), fetch the tiny GGUF (verified against versions.lock). llama-swap is what `bob up`
      # launches as the endpoint, so it must be built before the stack comes up. All via the Python
      # front door / kernel.
      - name: Select CPU profile + build + fetch (from versions.lock)
        shell: bash
        run: |
          python -m bob profile cpu
          python -m bob build --cpu
          python -m bob.kernel build-swap
          python -m bob fetch cpu

      # Prove the one-command installer's post-setup gate: the installed submodules + fetched model
      # match versions.lock, and the lock is in sync with its sources. (The install/install.sh clone-vs-
      # pull logic is gated by shellcheck + tests/test_install_bootstrap.py; here we exercise the
      # verify-install step it runs against the real provisioned tree.)
      - name: Verify against versions.lock (installer gate)
        shell: bash
        run: python -m bob.kernel verify-install

      - name: Bring the stack up
        shell: bash
        run: python -m bob up -NoOpen

      # The shared cross-OS end-to-end gate. --up also starts the agent server and tears it down after.
      # A red smoke blocks the PR. smoke.py is stdlib-only, runs on any interpreter.
      - name: End-to-end smoke
        run: python scripts/smoke.py --up

      # Prove fresh-install voice works by default: the faster-whisper STT server serves the /inference
      # contract on CPU. Fetches the tiny CT2 model (~75 MB, cached with models/) and does a synthetic-WAV
      # round-trip under venv-litellm. Gating — a broken default voice backend blocks the PR.
      - name: Voice STT smoke (faster-whisper CPU)
        shell: bash
        run: python scripts/smoke_voice.py

      # Surface why the endpoint died (the smoke only says "check: bob logs" — CI has no `bob logs`).
      - name: Dump service logs on failure
        if: failure()
        shell: bash
        run: |
          for log in logs/llama-swap.log logs/litellm.log logs/whisper.log; do
            echo "===== $log ====="
            if [ -f "$log" ]; then tail -n 120 "$log"; else echo "(missing)"; fi
          done
          echo "===== bin/ ====="
          ls -l bin 2>/dev/null || true

  # Fresh-install prereq matrix across the non-apt distro families, so the
  # dnf/pacman/zypper columns of osenv.PACKAGE_MAP (and install_prereqs.sh -> the kernel's per-distro
  # install) actually EXECUTE in CI instead of rotting untested (core-suite/acceptance-cpu only exercise
  # apt). Runs the documented one-command Linux entry inside each distro image, then `bob diagnose` (which
  # exits non-zero on any real problem — the honest health gate). Checkout stays on the host (the distro
  # images lack the Node the checkout action needs); the workspace is bind-mounted into the container.
  #
  # NON-GATING for now (continue-on-error) — like `eval` started: distro package-name drift (esp. the
  # opensuse nodejs-default/npm-default guesses) surfaces here in the log without blocking merges. Flip
  # to gating (remove continue-on-error) once the names are proven green across all three images.
  prereqs-distro:
    name: prereqs (${{ matrix.image }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:latest', 'archlinux:latest', 'opensuse/tumbleweed:latest']
    steps:
      - uses: actions/checkout@v4
      - name: install_prereqs.sh + diagnose (in ${{ matrix.image }})
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/bob -w /bob "${{ matrix.image }}" bash -c '
            set -e
            chmod +x install_prereqs.sh
            ./install_prereqs.sh --cpu
            PYTHONPATH=scripts python3 -m bob diagnose
          '

  # Native-from-source CUDA + REAL inference. RELEASE TAGS ONLY (job-level `if`), on a self-hosted GPU
  # runner. This tier is NEVER on the per-PR path, so a fragile native build cannot red a merge. Green
  # here is what makes a tagged release GPU-eligible.
  acceptance-gpu:
    name: acceptance-gpu (native CUDA, release tags)
    # Opt-in: only runs when a self-hosted GPU runner is registered and repo variable GPU_RUNNER=true is set.
    # Without the guard this job sits queued forever on a tag (no runner picks it up) and stalls the run.
    if: startsWith(github.ref, 'refs/tags/v') && vars.GPU_RUNNER == 'true'
    runs-on: [self-hosted, gpu]
    env:
      PYTHONPATH: scripts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Provision (native CUDA), build, fetch, serve
        shell: bash
        run: |
          python -m bob.kernel venv litellm
          python -m bob build --from-source   # native-from-source CUDA (auto-detected arch)
          python -m bob.kernel build-swap  # the llama-swap proxy (Go)
          python -m bob profile auto       # size to the card's VRAM
          python -m bob fetch              # active profile's models (verified vs versions.lock)
          python -m bob up -NoOpen

      - name: Assert the source build recorded a GPU tier marker
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("bin/.build-tier.json"))
          assert m["tier"] == "gpu" and m["source"] == "source", m
          print("engine tier marker OK:", m)
          PY

      - name: End-to-end smoke (real inference)
        run: python scripts/smoke.py --up

  # Build + publish the prebuilt, DRIVER-ONLY engine binaries for a tagged release (the outlier fix: users
  # download these instead of compiling). Both tiers build in an OLD-glibc container (Ubuntu 20.04, glibc
  # 2.31) so the binary runs on essentially every current distro (manylinux principle: build old, run
  # newer); a host with a still-older glibc is caught by lifecycle._binary_runs and safely falls back to a
  # source build. The CUDA archive bundles the CUDA runtime libs and the binary's rpath is set to $ORIGIN
  # (patchelf), so a target box needs only the NVIDIA driver. Each binary uploads to the GitHub release with
  # a build-provenance attestation; the publish-manifest job assembles their rows into an engines.json release
  # asset that lifecycle.ensure_engine fetches + SHA-verifies + stages. Windows engines are built the same way
  # by publish-engines-windows (below), so every asset matches the exact pinned llama.cpp commit.
  #
  # arm64 Linux and AMD/Intel (Vulkan/ROCm) GPUs have no asset today, so they fall back to a source build
  # (AMD/Intel land the CPU tier until a Vulkan backend is added). NVIDIA Turing..Blackwell are all covered by
  # the one fat multi-arch CUDA binary.
  publish-engines-linux:
    name: publish-engines (linux ${{ matrix.tier }}, release tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # upload release assets
      id-token: write            # build provenance attestation (sigstore)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        tier: [cuda, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build + package the ${{ matrix.tier }} engine in an old-glibc container (portable, no GPU needed)
        shell: bash
        run: |
          set -e
          img="ubuntu:20.04"
          [ "${{ matrix.tier }}" = "cuda" ] && img="nvidia/cuda:12.8.0-devel-ubuntu20.04"
          docker run --rm -e TIER="${{ matrix.tier }}" -v "$PWD":/bob -w /bob "$img" bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y && apt-get install -y git ninja-build g++ python3 patchelf tar
            git config --global --add safe.directory "*"   # the mounted repo is owned by the host uid
            name="llama-server-linux-x86_64-$TIER"
            staging="dist/$name"; mkdir -p "$staging"
            if [ "$TIER" = "cuda" ]; then
              PYTHONPATH=scripts python3 -m bob build --dist --cuda-archs "75;80;89;120"
              cp bin/llama-server "$staging"/
              for lib in libcudart libcublas libcublasLt; do
                f=$(find /usr/local/cuda -name "${lib}.so.*" 2>/dev/null | head -1 || true)
                [ -n "$f" ] && cp -L "$f" "$staging"/ || echo "WARN: $lib not found to bundle"
              done
              patchelf --set-rpath "\$ORIGIN" "$staging/llama-server"   # find bundled libs next to the binary
            else
              PYTHONPATH=scripts python3 -m bob build --dist --cpu
              cp bin/llama-server "$staging"/
            fi
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          '

      - name: Checksum + emit the engines.json row
        id: pkg
        shell: bash
        run: |
          set -e
          tier="${{ matrix.tier }}"; name="llama-server-linux-x86_64-$tier"
          sha=$(sha256sum "dist/$name.tar.gz" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$name.tar.gz"
          commit=$(git rev-parse "HEAD:external/llama.cpp")
          archs="75;80;89;120"; cmaj="12"
          [ "$tier" = "cpu" ] && archs="" && cmaj="null"
          mkdir -p rows
          cat > "rows/$name.json" <<JSON
          {"$name": {"component": "llama-server", "os": "linux", "cpuArch": "x86_64", "tier": "$tier",
            "url": "$url", "sha256": "$sha", "builtFromCommit": "$commit", "cudaArchs": "$archs", "cudaMajor": $cmaj}}
          JSON
          echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.asset }}" --clobber

      - name: Attest build provenance (tamper-evident, verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}

      - name: Stash the engines.json row for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: engine-row-linux-${{ matrix.tier }}
          path: rows/*.json

  # Windows engines, built by Bob for consistency (so the asset matches the exact pinned llama.cpp commit,
  # avoiding a brittle official-asset-to-commit mapping). Bundled CUDA DLLs sit next to the .exe (Windows
  # resolves those from the exe's own dir), so the target needs only the NVIDIA driver. First-run CI: expect
  # to shake out the CUDA-toolkit install + VS build here, like the GPU acceptance tier.
  publish-engines-windows:
    name: publish-engines (windows ${{ matrix.tier }}, release tags)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write            # build provenance attestation (sigstore)
      attestations: write
    env:
      PYTHONPATH: scripts
    strategy:
      fail-fast: false
      matrix:
        tier: [cuda, cpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CUDA toolkit (cuda tier only)
        if: matrix.tier == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35   # 12.8.0 is available from this release onward
        with:
          cuda: '12.8.0'
          method: network
      - name: Build + package the ${{ matrix.tier }} engine
        shell: bash
        run: |
          set -e
          name="llama-server-windows-x86_64-${{ matrix.tier }}"
          staging="dist/$name"; mkdir -p "$staging"
          if [ "${{ matrix.tier }}" = "cuda" ]; then
            python -m bob build --dist --cuda-archs "75;80;89;120"
          else
            python -m bob build --dist --cpu
          fi
          # build_llama already staged the CUDA runtime DLLs next to llama-server.exe in bin/ on Windows.
          cp bin/llama-server.exe "$staging"/
          cp bin/*.dll "$staging"/ 2>/dev/null || true
          powershell -Command "Compress-Archive -Path '$staging/*' -DestinationPath 'dist/$name.zip' -Force"
      - name: Checksum + emit the engines.json row
        id: pkg
        shell: bash
        run: |
          set -e
          tier="${{ matrix.tier }}"; name="llama-server-windows-x86_64-$tier"
          sha=$(sha256sum "dist/$name.zip" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$name.zip"
          commit=$(git rev-parse "HEAD:external/llama.cpp")
          archs="75;80;89;120"; cmaj="12"
          [ "$tier" = "cpu" ] && archs="" && cmaj="null"
          mkdir -p rows
          cat > "rows/$name.json" <<JSON
          {"$name": {"component": "llama-server", "os": "windows", "cpuArch": "x86_64", "tier": "$tier",
            "url": "$url", "sha256": "$sha", "builtFromCommit": "$commit", "cudaArchs": "$archs", "cudaMajor": $cmaj}}
          JSON
          echo "asset=dist/$name.zip" >> "$GITHUB_OUTPUT"
      - name: Upload the asset to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.asset }}" --clobber
      - name: Attest build provenance (tamper-evident, verify with `gh attestation verify`)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.pkg.outputs.asset }}
      - name: Stash the engines.json row for the manifest job
        uses: actions/upload-artifact@v4
        with:
          name: engine-row-windows-${{ matrix.tier }}
          path: rows/*.json

  # Assemble the engine manifest from the published rows and upload it AS A RELEASE ASSET (engines.json).
  # No commit, no PR, no repo write-back: lifecycle.ensure_engine fetches this manifest for the release tag
  # a checkout is on, then downloads + SHA-verifies the matching binary. Adding platforms/components/channels
  # never churns the repo, so this scales as the build matrix grows. Only `contents: write` (asset upload) is
  # needed; there is no pull-request permission and nothing to merge to activate a release.
  publish-manifest:
    name: publish-manifest (engines.json release asset)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-engines-linux, publish-engines-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-row-*
          path: rows
          merge-multiple: true
      - name: Assemble engines.json from the published rows
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, json
          rows = {}
          for f in glob.glob("rows/*.json"):
              rows.update(json.load(open(f)))
          open("engines.json", "w").write(json.dumps(rows, indent=2) + "\n")
          print("engines.json rows:", list(rows))
          PY
      - name: Upload engines.json to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" engines.json --clobber --repo "${GITHUB_REPOSITORY}"
